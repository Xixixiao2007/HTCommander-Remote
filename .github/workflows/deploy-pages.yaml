name: Deploy GitHub Pages

# Disabled in this fork, deliberately.
#
# Upstream runs this to publish its documentation site from docs/. In a fork
# that would publish a copy of the upstream site under this repository's name,
# which is misleading and of no use here. It also meant every change to
# docs/** turned the workflow red on a repository that never enabled Pages, and
# a red run that is expected is worse than no run: it trains people to ignore
# the colour and hides real failures.
#
# Kept, not deleted, so the decision is visible and reversible: to publish this
# fork's own documentation site, enable Pages in the repository settings and
# re-add the triggers below.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Manual dispatch only, so this cannot fail spontaneously.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
